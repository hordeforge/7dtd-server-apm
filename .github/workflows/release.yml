name: release

# Tag-driven releases (hordeforge/.github REPOSITORY_STANDARDS.md, §8): a
# vX.Y.Z tag must agree with the version this repository actually ships, so a
# mistyped or forgotten bump is rejected instead of becoming a release nobody
# can reproduce. The tag check and the repo's own version gate
# (scripts/check_version.py, also run by `make test`) both run here, so a tag
# that disagrees with any of the five version sources is rejected.
#
# The mod archive is deliberately NOT built here. `make package` compiles
# against the dedicated server's own assemblies, which a hosted runner does
# not have; a maintainer with a game install runs `make package` and attaches
# the zip. Gating the tag is the half that can be proven automatically, and
# asserting the other half here would be a claim, not evidence.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Actions pinned by full commit SHA (tag in comment) so a moved tag or a
      # compromised major-version release cannot inject code into the pipeline.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches bridge/ApmBridge/ModInfo.xml
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          MANIFEST="bridge/ApmBridge/ModInfo.xml"
          SHIPPED="$(sed -n 's/.*<Version[^>]*value="\([^"]*\)".*/\1/p' "$MANIFEST" | head -1)"
          if [ -z "$SHIPPED" ]; then
            echo "ERROR: no <Version value=\"...\"> found in $MANIFEST" >&2
            exit 1
          fi
          if [ "$SHIPPED" != "${TAG#v}" ]; then
            echo "ERROR: tag $TAG but $MANIFEST ships $SHIPPED; make them match before tagging" >&2
            exit 1
          fi
          echo "ok: tag $TAG matches $MANIFEST ($SHIPPED)"
      # The manifest is one of five version sources. A tag that agrees with it
      # while BridgeMod.cs, bridge/README.md, pyproject.toml or the CHANGELOG
      # disagree would ship a mod that fails the repo's own gate (make test
      # runs this), so the release runs the same script the local gate does
      # instead of trusting the tag check alone.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Same interpreter pin the local gate resolves from .python-version.
          python-version-file: .python-version
          enable-cache: true
          cache-local-path: .uv-cache
          cache-dependency-glob: "uv.lock"
      - name: Run the version gate over every version source
        run: |
          set -euo pipefail
          export UV_CACHE_DIR="$PWD/.uv-cache"
          uv run --locked --project . python scripts/check_version.py
