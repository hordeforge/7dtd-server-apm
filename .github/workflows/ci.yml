name: ci
on:
  push:
    branches: [main]
  pull_request:

# Checkout only; the workflow never publishes artifacts from CI.
permissions:
  contents: read

# Superseded runs on the same branch/PR are cancelled instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Same cache directory the Makefile pins, so the explicit `uv sync` below
    # and every make target share one restored cache instead of two cold ones.
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    steps:
# Actions are pinned to immutable commit SHAs (mutable tags are a
# supply-chain risk); Dependabot keeps the SHAs current via the comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # .python-version is the one interpreter pin (3.12); naming the file
          # keeps the runner from silently falling back to whatever the image
          # ships while a local `uv run` already uses the pin.
          python-version-file: .python-version
          # The Makefile pins UV_CACHE_DIR to the repo-local .uv-cache, so the
          # cache has to be restored at that same path to have any effect.
          enable-cache: true
          cache-local-path: .uv-cache
          cache-dependency-glob: "uv.lock"
      # The runner image is pinned (ubuntu-24.04) so the distro shellcheck does
      # not move under the gate; `make lint-shell` prints the installed version
      # and warns on a mismatch with scripts/lib/tool_versions.sh, so a bump is
      # visible in the log instead of silently changing the verdict.
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: uv sync --locked
      # The lint scripts run oxlint, tsc and vnu through bunx at pinned
      # versions; the runner preinstalls node, but not bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: make check-ci
        # check-bt needs a host kernel; see Makefile check-ci

  coverage-badge:
    # Publishes the line-coverage badge to the badges branch, which
    # raw.githubusercontent serves to the README. Main pushes only: a PR gets
    # its verdict from the python job and never sees the write token this job
    # needs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: python
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    permissions:
      contents: write
    steps:
# Actions are pinned to immutable commit SHAs (mutable tags are a
# supply-chain risk); Dependabot keeps the SHAs current via the comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Same interpreter pin as the python job, so the badge it publishes
          # comes from the version the gate runs under.
          python-version-file: .python-version
          enable-cache: true
          cache-local-path: .uv-cache
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - run: make coverage
      - run: uv run --locked python scripts/coverage_badge.py "$RUNNER_TEMP/coverage.svg"
      - name: Publish the badge to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git clone --depth 1 --branch badges "$url" badge-repo
          else
            git init -q -b badges badge-repo
          fi
          cp "$RUNNER_TEMP/coverage.svg" badge-repo/
          cd badge-repo
          git remote remove origin 2>/dev/null || true
          git remote add origin "$url"
          git config user.name "hordeforge-ci"
          git config user.email "ci@hordeforge.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -m "update coverage badge"
          git push origin badges
