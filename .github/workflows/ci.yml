name: ci
on:
  push:
    branches: [main]
  pull_request:

# Checkout only; the workflow never publishes artifacts from CI.
permissions:
  contents: read

# Superseded runs on the same branch/PR are cancelled instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: uv sync --locked
      - run: make check-ci
        # check-bt needs a host kernel; see Makefile check-ci
