name: ci
on:
  push:
    branches: [main]
  pull_request:

# Checkout only; the workflow never publishes artifacts from CI.
permissions:
  contents: read

# Superseded runs on the same branch/PR are cancelled instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
# Actions are pinned to immutable commit SHAs (mutable tags are a
# supply-chain risk); Dependabot keeps the SHAs current via the comments.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: uv sync --locked
      - run: make check-ci
        # check-bt needs a host kernel; see Makefile check-ci
