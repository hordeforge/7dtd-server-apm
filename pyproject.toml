[project]
name = "seven-dtd-apm"
version = "2.1.0"
description = "Host-only APM for 7 Days to Die dedicated servers"
readme = "README.md"
license = "MIT"
authors = [{ name = "7DTD performance toolkit contributors" }]
requires-python = ">=3.11"
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "jinja2>=3.1,<4",
  "psutil>=6,<8",
  "pydantic>=2.9,<3",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.urls]
Repository = "https://github.com/hordeforge/7dtd-server-apm"

[project.scripts]
7dtd-server-apm = "apm_suite.cli:app"

[dependency-groups]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "types-psutil>=6,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/apm_suite"]
# Tests and fixtures are development material; they never ship in the wheel.
exclude = ["tools/apm_suite/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["research", "tools/apm/testdata"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "A", "ASYNC", "RUF100"]
ignore = ["E501"] # Formatter cannot wrap embedded HTML, regexes, and generated snippets safely.

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "tools"
files = [
  "tools/apm_suite",
  "tools/apm/collectors/app_scrape.py",
  "tools/apm/collectors/threads.py",
  "scripts/check_version.py",
  "plans/ladder_report.py",
  "plans/scale_ladder.py",
]

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tools/apm_suite/tests"]
addopts = "-q"
