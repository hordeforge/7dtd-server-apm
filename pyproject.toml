[project]
name = "seven-dtd-apm"
version = "2.2.0"
description = "Host-only APM for 7 Days to Die dedicated servers"
readme = "README.md"
license = "MIT"
authors = [{ name = "7DTD performance toolkit contributors" }]
requires-python = ">=3.11"
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
]
# Five runtime dependencies, each earning its place; the default is zero new
# ones. A dependency added without beating "we could write this" does not land.
#   jinja2  - report and dashboard HTML templates (autoescaping is the point;
#             hand-rolled escaping in capture output is a security surface).
#   psutil  - per-process CPU/thread/memory accounting for the collectors;
#             /proc parsing is Linux-version specific and easy to get wrong.
#   pydantic - the capture summary schema, validated at load so a bad field
#             reads as unavailable instead of a downstream AttributeError.
#   rich    - console output, markup escaping for untrusted collector text.
#   typer   - the CLI surface, argument parsing and help.
# Everything else the tools need (metrics, yaml, statistics) is stdlib. Dev
# tooling lives in [dependency-groups] and never reaches a release install.
dependencies = [
  "jinja2>=3.1,<4",
  "psutil>=6,<8",
  "pydantic>=2.9,<3",
  "rich>=13.9,<16",
  "typer>=0.15,<1",
]

[project.urls]
Repository = "https://github.com/hordeforge/7dtd-server-apm"

[project.scripts]
7dtd-server-apm = "apm_suite.cli:app"

[dependency-groups]
dev = ["mypy>=1.14,<3", "pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "types-psutil>=6,<8"]

[build-system]
# The build backend is resolved in PEP 517 build isolation, so it is the one
# dependency uv.lock cannot hash-pin: every `uv sync` of the editable install
# downloads it. Bound it to one major so a fresh checkout cannot pick up an
# unreviewed release of the tool that builds the artifact.
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/apm_suite"]
# Tests and fixtures are development material; they never ship in the wheel.
exclude = ["tools/apm_suite/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
# apm_suite lives under tools/, so ruff must classify it as first-party; without
# this the import sorter demands the package be merged into the third-party
# block in some files and split out in others, and the two orderings conflict.
src = ["tools"]

[tool.ruff.lint]
# RET (return simplification) and W (incl. invalid escape sequences) were
# adopted on 2026-08-24 with zero violations across tools/, scripts/, plans/.
# PLE (pylint errors), YTT (sys-version traps), and DTZ (naive datetimes) were
# adopted on 2026-08-25 with zero violations; DTZ's single deliberate naive
# strptime carries a scoped noqa at tools/host_profiler/correlate.py.
# PGH (blanket noqa / blanket type-ignore bans) was adopted on 2026-08-26 with
# zero violations: every suppression must already name its rule.
select = ["E", "F", "I", "UP", "B", "SIM", "A", "ASYNC", "RET", "W", "DTZ", "PLE", "YTT", "PGH", "RUF100"]
ignore = ["E501"] # Formatter cannot wrap embedded HTML, regexes, and generated snippets safely.

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "tools"
# Whole roots instead of a file allowlist: every Python file under these three
# trees is type-checked, so a new module is covered by default rather than
# silently escaping the gate until someone remembers to list it.
files = ["tools", "scripts", "plans"]
# Beyond strict: an unreachable branch usually means dead code or a type lie,
# and these error codes are not part of strict. All four pass the tree clean
# as of 2026-08-25; bare ignores were already banned de facto (every existing
# ignore carries its error code).
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "possibly-undefined",
  "redundant-self",
  "deprecated",
  # Added 2026-08-26, all three verified clean across tools/, scripts/, plans/:
  # truthy-bool flags conditions on objects that are always truthy,
  # redundant-expr flags comparisons a type already decides, and
  # unimported-reveal catches reveal_type debug leftovers left unimported.
  "truthy-bool",
  "redundant-expr",
  "unimported-reveal",
]

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tools/apm_suite/tests"]
addopts = "-q"
